# amtechai.com is one Hugo project, site/ (read site/README.md). `npm run build` builds the CSS and the pages, then
# checks them; Netlify publishes site/public. Redirects and headers are site/static/_redirects and _headers.
[build]
  command = "npm run build"
  publish = "site/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# Serve <route>/index.html at the clean, no-trailing-slash URL with no redirect hop: a redirect gives redirect-averse
# agents and crawlers an empty 301 body and fights the no-slash canonical.
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = false
