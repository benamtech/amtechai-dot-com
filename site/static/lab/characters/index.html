<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab: the characters on the site</title>
<meta name="description" content="Every AMTECH character shape in every hue, drawn by the site's module ported from the application.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://amtechai.com/lab/characters">
<link rel="stylesheet" href="/lab/_shared/fonts.css">
<style>body{margin:0;font:14px/1.5 Geist,system-ui,sans-serif;color:#111;background:#fff}main{max-width:1200px;margin:48px auto;padding:0 24px}
h1{font-size:24px;letter-spacing:-.02em;margin:0 0 20px}.row{display:flex;gap:18px;align-items:end;flex-wrap:wrap;margin:0 0 18px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px}.cell small{font:11px 'IBM Plex Mono',monospace;color:#6b6b6b}</style>
</head><body><main>
<h1>The characters</h1>
<div id="employees" class="row"></div>
<div id="team" class="row"></div>
<div id="sizes" class="row"></div>
</main>
<script type="module">
import { characterSVG, SHAPE_NAMES, HUES, EMPLOYEE_HUES } from "/lab/_shared/characters.js";
const cell = (svg, label) => `<div class="cell">${svg}<small>${label}</small></div>`;
document.getElementById("employees").innerHTML = EMPLOYEE_HUES.map((h, i) => cell(characterSVG({ shape: SHAPE_NAMES[i], hue: h, size: 72, plinth: true }), SHAPE_NAMES[i])).join("");
document.getElementById("team").innerHTML = SHAPE_NAMES.map((s, i) => cell(characterSVG({ shape: s, hue: HUES[i % HUES.length], size: 48 }), s)).join("");
document.getElementById("sizes").innerHTML = [14, 18, 24, 36, 56, 96, 160].map((z) => cell(characterSVG({ shape: "gem", hue: "#2F9E5A", size: z, plinth: true }), z + " px")).join("");
</script>
</body></html>
